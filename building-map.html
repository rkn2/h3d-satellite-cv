<title>Tornado Building Inventory</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root {
  --surface: #f7f7f5;
  --surface-card: #ffffff;
  --text-1: #1a1a18;
  --text-2: #5c5b56;
  --text-3: #8a8983;
  --border: #e2e1dc;
  --accent: #2a78d6;
  --accent-muted: #2a78d620;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface: #161615;
    --surface-card: #222220;
    --text-1: #f0efeb;
    --text-2: #b0afa8;
    --text-3: #7a7973;
    --border: #3a3a36;
    --accent: #5a9ee6;
    --accent-muted: #5a9ee620;
  }
}
:root[data-theme="dark"] {
  --surface: #161615;
  --surface-card: #222220;
  --text-1: #f0efeb;
  --text-2: #b0afa8;
  --text-3: #7a7973;
  --border: #3a3a36;
  --accent: #5a9ee6;
  --accent-muted: #5a9ee620;
}

* { box-sizing: border-box; }
body {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  background: var(--surface);
  color: var(--text-1);
  margin: 0;
  padding: 0;
  height: 100%;
}
html { height: 100%; }

.app {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: var(--surface-card);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 1000;
}
.toolbar h1 {
  font-size: 15px;
  font-weight: 600;
  margin: 0;
  white-space: nowrap;
}
.toolbar label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-2);
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.toolbar select {
  font-family: inherit;
  font-size: 13px;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface);
  color: var(--text-1);
  cursor: pointer;
}
.toolbar .sep {
  width: 1px;
  height: 24px;
  background: var(--border);
}
.stats {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

#map {
  flex: 1;
  min-height: 0;
}

.legend {
  position: absolute;
  bottom: 28px;
  left: 16px;
  z-index: 900;
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 12px;
  max-width: 220px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.legend h3 {
  margin: 0 0 6px 0;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-2);
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 2px 0;
  font-size: 12px;
  color: var(--text-1);
}
.legend-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 1px solid rgba(0,0,0,0.1);
}

.popup-table {
  font-size: 12px;
  border-collapse: collapse;
  width: 100%;
}
.popup-table td {
  padding: 2px 6px 2px 0;
  vertical-align: top;
}
.popup-table td:first-child {
  font-weight: 500;
  color: var(--text-2);
  white-space: nowrap;
}
.popup-addr {
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 6px;
}
.popup-badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 500;
}
</style>

const PALETTES = {
  archetype: {
    title: 'Predicted Archetype',
    colors: {
      1:'#d94f1a', 2:'#e68a3c', 3:'#c4a23e', 4:'#7fb55e', 5:'#3fae8c',
      6:'#2a9fd6', 7:'#2a78d6', 8:'#5c5ec7', 9:'#8c52b8', 11:'#c44da0',
      12:'#d6547a', 13:'#a67c52', 14:'#6b8e6b', 17:'#d68f2a', 18:'#708090',
      19:'#b8860b'
    },
    label: v => v ? 'T'+v : 'Unknown',
    get: d => d[4]
  },
  damage: {
    title: 'Predicted Damage',
    colors: { none:'#4a9e5c', moderate:'#d4a843', severe:'#c94040' },
    label: v => v || 'No prediction',
    get: d => d[8]
  },
  stories: {
    title: 'Predicted Stories',
    colors: { '1':'#5aade0', '2':'#2a78d6', '3':'#4040a8', '4+':'#2d1e5e' },
    label: v => v ? v+' story' : 'Unknown',
    get: d => d[5]
  },
  roof: {
    title: 'Predicted Roof',
    colors: { gable_family:'#d6782a', hip_family:'#2a9fd6', complex_family:'#8c52b8', flat:'#5c8a5c' },
    label: v => v ? v.replace('_family','').replace('_',' ') : 'Unknown',
    get: d => d[6]
  },
  construction: {
    title: 'Predicted Construction',
    colors: { masonry:'#c94040', wood_frame:'#d4a843', steel:'#708090', concrete:'#5c8a5c' },
    label: v => v || 'Unknown',
    get: d => d[7]
  },
  source: {
    title: 'Data Source',
    colors: { s:'#2a78d6', u:'#d6782a', n:'#4a9e5c', q:'#8c52b8' },
    label: v => ({s:'StEER',u:'Undergrad (StL)',n:'Nashville',q:'Quad-State'}[v] || v),
    get: d => d[2]
  },
  existing_damage: {
    title: 'Existing Damage Label',
    colors: {
      'Negligible to Slight':'#4a9e5c', 'Moderate':'#d4a843',
      'Substantial to Heavy':'#e07030', 'Very Heavy':'#c94040',
      'Destruction':'#6b1010',
      'undamaged':'#4a9e5c', 'minor':'#8cbd5c', 'minor_damage':'#8cbd5c',
      'moderate':'#d4a843', 'decent_damage':'#d4a843',
      'severe':'#c94040', 'major_damage':'#c94040',
      'destroyed':'#6b1010', 'unknown':'#999'
    },
    label: v => v || 'No label',
    get: d => d[9]
  }
};

const UNKNOWN_COLOR = '#b0afa8';

const map = L.map('map',{preferCanvas:true}).setView([38.655, -90.255], 13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'OpenStreetMap / CARTO', maxZoom:19
}).addTo(map);

let markers = [];
const statsEl = document.getElementById('stats');
const legendEl = document.getElementById('legend');

function render() {
  const mode = document.getElementById('colorBy').value;
  const srcFilter = document.getElementById('filterSource').value;
  const pal = PALETTES[mode];

  markers.forEach(m => map.removeLayer(m));
  markers = [];

  const counts = {};
  let shown = 0;

  DATA.forEach(d => {
    if (srcFilter !== 'all' && d[2] !== srcFilter) return;
    const val = pal.get(d);
    const color = pal.colors[val] || UNKNOWN_COLOR;
    const key = val || '_unknown';
    counts[key] = (counts[key]||0) + 1;
    shown++;

    const cm = L.circleMarker([d[0], d[1]], {
      radius: 5, fillColor: color, color: '#fff', weight: 1,
      fillOpacity: 0.85, opacity: 0.6
    });

    const srcName = {s:'StEER',u:'Undergrad',n:'Nashville',q:'Quad-State'}[d[2]]||d[2];
    cm.bindPopup(`
      <div class="popup-addr">${d[3]}</div>
      <table class="popup-table">
        <tr><td>Source</td><td>${srcName}</td></tr>
        <tr><td>Pred. Archetype</td><td><b>T${d[4]}</b></td></tr>
        <tr><td>Existing Archetype</td><td>${d[10]?'T'+d[10]:'—'}</td></tr>
        <tr><td>Pred. Stories</td><td>${d[5]||'—'}</td></tr>
        <tr><td>Pred. Roof</td><td>${(d[6]||'—').replace('_family','').replace('_',' ')}</td></tr>
        <tr><td>Pred. Construction</td><td>${d[7]||'—'}</td></tr>
        <tr><td>Pred. Damage</td><td><span class="popup-badge" style="background:${PALETTES.damage.colors[d[8]]||'#ccc'}; color:#fff">${d[8]||'—'}</span></td></tr>
        <tr><td>Existing Damage</td><td>${d[9]||'—'}</td></tr>
      </table>
    `, {maxWidth:280});

    cm.addTo(map);
    markers.push(cm);
  });

  statsEl.textContent = shown.toLocaleString()+' buildings';

  // Legend
  let html = '<h3>'+pal.title+'</h3>';
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  sorted.forEach(([k,c]) => {
    const val = k === '_unknown' ? '' : k;
    const color = pal.colors[val] || UNKNOWN_COLOR;
    html += `<div class="legend-item">
      <span class="legend-dot" style="background:${color}"></span>
      ${pal.label(val)} <span style="color:var(--text-3);margin-left:auto">${c}</span>
    </div>`;
  });
  legendEl.innerHTML = html;
}

document.getElementById('colorBy').addEventListener('change', render);
document.getElementById('filterSource').addEventListener('change', render);

render();
</script>
